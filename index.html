<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ergonomía · GH</title>
<meta name="theme-color" content="#f7f8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14170f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ergonomía">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="stylesheet" href="css/app.css">
<script>try{var e=localStorage.getItem('gh-escala:gh-ergonomia');if(e==='115'||e==='130'||e==='150')document.documentElement.setAttribute('data-escala',e)}catch(_){}</script>
<style>
/* ---------- tamaño de interfaz (control de accesibilidad; escala todo con zoom) ---------- */
html[data-escala="115"]{zoom:1.15;--gh-z:1.15}
html[data-escala="130"]{zoom:1.3;--gh-z:1.3}
html[data-escala="150"]{zoom:1.5;--gh-z:1.5}
@media print{html[data-escala]{zoom:1}}
.gh-esc{position:relative;flex:none;width:44px;height:44px;display:inline-grid;place-items:center;padding:0;border:0;border-radius:50%;
  background:rgba(128,128,128,.14);color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gh-esc:active{background:rgba(128,128,128,.28)}
.gh-esc:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.gh-esc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gh-esc-n{position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;min-width:30px;padding:0 4px;border-radius:999px;background:#4a7a1e;color:#fff;
  font:700 11px/16px -apple-system,"SF Pro Text",system-ui,sans-serif;text-align:center}
.gh-esc-n:empty{display:none}
.gh-esc[hidden]{display:none}
.gh-esc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@supports not (zoom:1){.gh-esc{display:none}}
/* con zoom, vh/dvh también se multiplican: se divide para que las pantallas altas sigan midiendo el alto real */
.gh-login{min-height:calc(100vh / var(--gh-z,1));min-height:calc(100dvh / var(--gh-z,1))}
/* con el viewport efectivo más angosto, el botón de Google necesita lugar: se achican los rellenos del login */
html[data-escala="130"] .gh-login{padding-left:8px;padding-right:8px}
html[data-escala="130"] .gh-login-card{padding-left:14px;padding-right:14px}
html[data-escala="150"] .gh-login{padding-left:4px;padding-right:4px}
html[data-escala="150"] .gh-login-card{padding-left:8px;padding-right:8px}
html[data-escala="150"] .barra{padding-left:10px;padding-right:10px;gap:6px}
html[data-escala="150"] .marca{padding:0 10px 0 6px}
html[data-escala="130"] .barra .marca span,html[data-escala="150"] .barra .marca span{display:none}
.lateral{max-height:calc((100vh - 88px) / var(--gh-z,1))}
.hoja{max-height:calc((100vh - 48px) / var(--gh-z,1))}
.lienzo canvas{max-height:calc(70vh / var(--gh-z,1))}
.barra .gh-esc{margin-left:auto}
</style>
</head>
<body>
  <header class="barra">
    <div class="scroll-edge"></div>
    <a class="marca liquid-glass" href="#/" title="Inicio">
      <img src="assets/logo-gh.png" alt="">
      <span>Ergonomía</span>
    </a>
    <nav class="migas" id="migas"></nav>
    <div class="estado" id="estado" aria-live="polite"></div><button type="button" class="gh-esc" id="btnEscalaMenos" aria-label="Achicar letra" title="Achicar letra" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button><button type="button" class="gh-esc" id="btnEscala" aria-label="Agrandar letra" title="Agrandar letra"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg><span class="gh-esc-n" id="escalaNivel" aria-hidden="true"></span></button><span class="gh-esc-sr" id="escalaLive" role="status" aria-live="polite"></span>
  </header>
  <main id="app"></main>
  <div id="capa" class="capa" hidden></div>
  <div id="aviso" class="aviso" role="status" hidden></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/docx.iife.js"></script>
  <script src="js/datos886.js"></script>
  <script src="js/reba.js"></script>
  <script src="js/evaluar.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/word.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/app.js"></script>
<script>
/* Tamaño de interfaz: 100 -> 115 -> 130 -> 150 -> 100. Se recuerda por app; sin localStorage sigue andando. */
(function(){
  var K='gh-escala:gh-ergonomia',N=[100,115,130,150],h=document.documentElement,b=document.getElementById('btnEscala');
  if(!b)return;
  function leer(){try{var v=parseInt(localStorage.getItem(K),10);return N.indexOf(v)<0?100:v}catch(e){return 100}}
  function poner(v,avisar){
    if(v===100)h.removeAttribute('data-escala');else h.setAttribute('data-escala',v);
    document.getElementById('escalaNivel').textContent=v===100?'':v+'%';var m=document.getElementById('btnEscalaMenos');if(m)m.hidden=(v===100);
    b.title='Agrandar letra (ahora '+v+'%)';
    if(avisar)document.getElementById('escalaLive').textContent='Tamaño de la interfaz: '+v+'%';
  }
  var v=leer();poner(v,false);
  function ir(n){v=n;poner(v,true);try{if(v===100)localStorage.removeItem(K);else localStorage.setItem(K,String(v))}catch(e){}}
  b.addEventListener('click',function(){ir(N[(N.indexOf(v)+1)%N.length])});
  var m=document.getElementById('btnEscalaMenos');if(m)m.addEventListener('click',function(){ir(N[Math.max(0,N.indexOf(v)-1)])});
})();
</script>
</body>
</html>
